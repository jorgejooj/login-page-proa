<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Minha Conta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="login-page">
    <section class="login-card" aria-labelledby="titulo-login">

      <header class="login-header">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1 id="titulo-login">Bem-vindo de volta</h1>
        <p>Entre com suas credenciais para continuar</p>
      </header>

      <form class="login-form" action="#" method="post">

        <div class="campo">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="input-wrapper">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" minlength="6" required>
            <button type="button" class="toggle-senha" aria-label="Mostrar senha" id="toggleSenha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="opcoes">
          <label class="lembrar">
            <input type="checkbox" name="lembrar">
            Lembrar de mim
          </label>
          <a href="#" class="link">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>
      </form>

      <p class="rodape">
        Não tem uma conta? <a href="#" class="link destaque">Cadastre-se</a>
      </p>

    </section>
  </main>

  <script>
    const botaoToggle = document.getElementById('toggleSenha');
    const campoSenha = document.getElementById('senha');

    botaoToggle.addEventListener('click', () => {
      const oculta = campoSenha.type === 'password';
      campoSenha.type = oculta ? 'text' : 'password';
      botaoToggle.setAttribute('aria-label', oculta ? 'Ocultar senha' : 'Mostrar senha');
    });
  </script>

</body>
</html>
